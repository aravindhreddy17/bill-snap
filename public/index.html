
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e4d7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Bill Snap</title>

<style>
:root {
  --bg: #f5ebe2;
  --card: #fffaf5;
  --tx: #352820;
  --mu: #907d70;
  --ac: #a66c4f;
  --acs: #f0dfd2;
  --am: #b87935;
  --amb: #fff0d9;
  --bd: #e9d9cc;
  --rd: #b94e43;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top, 0);
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px 110px;
}

h1 {
  font-size: 23px;
  margin: 4px 0 18px;
  font-weight: 750;
  letter-spacing: -0.5px;
}

h2 {
  font-size: 15px;
  margin: 18px 0 8px;
  color: var(--mu);
  font-weight: 600;
}

.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 5px 20px rgba(100, 65, 43, 0.045);
}

button, .btn {
  font: inherit;
  border: 0;
  border-radius: 15px;
  padding: 15px 16px;
  background: var(--ac);
  color: white;
  font-weight: 650;
  width: 100%;
  cursor: pointer;
  display: block;
  text-align: center;
  transition: transform .2s, opacity .2s;
}

button:active, .btn:active {
  transform: scale(.98);
}

.btn.alt {
  background: var(--acs);
  color: var(--ac);
  border: 1px solid #e6cfc0;
}

button.ghost {
  background: none;
  color: var(--mu);
  padding: 10px;
}

label {
  display: block;
  font-size: 13px;
  color: var(--mu);
  margin: 12px 0 4px;
}

input[type=text],
input[type=date],
input[type=number] {
  width: 100%;
  font: inherit;
  padding: 12px;
  border-radius: 12px;
  border: 1.5px solid var(--bd);
  background: var(--bg);
  color: var(--tx);
}

.flag input {
  border-color: var(--am);
  background: var(--amb);
}

.hint {
  font-size: 12.5px;
  color: var(--am);
  margin-top: 4px;
}

.ev {
  font-size: 12px;
  color: var(--mu);
  margin-top: 3px;
  word-break: break-word;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 8px 13px;
  border-radius: 99px;
  border: 1.5px solid var(--bd);
  font-size: 14px;
  cursor: pointer;
  background: var(--card);
}

.chip.on {
  background: var(--ac);
  border-color: var(--ac);
  color: white;
}

.row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.row img {
  width: 52px;
  height: 52px;
  object-fit: cover;
  border-radius: 10px;
  background: var(--bd);
}

.grow { flex: 1; min-width: 0; }

.t {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}

.s {
  font-size: 13px;
  color: var(--mu);
}

.amt {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.bar {
  height: 8px;
  border-radius: 6px;
  background: var(--acs);
  overflow: hidden;
  margin-top: 4px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--ac);
}

.spin {
  width: 28px;
  height: 28px;
  border: 3px solid var(--bd);
  border-top-color: var(--ac);
  border-radius: 50%;
  animation: r 1s linear infinite;
  margin: 0 auto 10px;
}

@keyframes r {
  to { transform: rotate(360deg); }
}

/* Premium home screen */
#app:has(input[type=file]) > .card {
  margin-top: clamp(65px, 15vh, 145px);
  padding: 25px 20px;
  border-radius: 24px;
  text-align: center;
}

#app:has(input[type=file]) > .card p {
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 24px !important;
}

#app:has(input[type=file]) .btn {
  padding: 17px;
  border-radius: 16px;
  margin-bottom: 12px !important;
  font-size: 15px;
}

#app:has(input[type=file]) .btn.alt {
  margin-bottom: 0 !important;
}

/* Scanning and preview elements */
.preview-image {
  width: 100%;
  max-height: 340px;
  object-fit: contain;
  display: block;
  border-radius: 16px;
  background: var(--bg);
  border: 1px solid var(--bd);
  margin: 12px 0;
}

.scan-status {
  background: var(--acs);
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  color: var(--ac);
  margin: 12px 0;
}

.scan-status .spin {
  margin-bottom: 8px;
}

.warn {
  background: var(--amb);
  color: var(--am);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  margin-bottom: 12px;
}

.del {
  color: var(--rd);
  font-size: 13px;
  background: none;
  width: auto;
  padding: 6px;
}

/* Bottom navigation */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: var(--card);
  border-top: 1px solid var(--bd);
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 5;
}

nav button {
  background: none;
  color: var(--mu);
  border-radius: 0;
  padding: 15px 4px;
  font-size: 14px;
}

nav button.on {
  color: var(--ac);
  font-weight: 750;
}

/* Toast */
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 90px;
  background: var(--tx);
  color: white;
  padding: 10px 16px;
  border-radius: 99px;
  font-size: 14px;
  display: none;
  z-index: 20;
  max-width: calc(100% - 32px);
  text-align: center;
}

/* Animated intro */
#splash {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f3e4d7;
  color: #593d30;
  animation: splashOut .5s ease 1.5s forwards;
}

.splash-logo {
  width: 86px;
  height: 86px;
  border-radius: 27px;
  background: #a66c4f;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fffaf5;
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -2px;
  box-shadow: 0 12px 35px rgba(116, 72, 48, .2);
  animation: logoIn .8s cubic-bezier(.2,.8,.2,1) both;
}

.splash-title {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1px;
  margin-top: 22px;
  animation: textIn .8s ease .2s both;
}

.splash-subtitle {
  color: #947969;
  font-size: 13px;
  letter-spacing: 1.5px;
  margin-top: 7px;
  animation: textIn .8s ease .35s both;
}

.splash-loader {
  width: 35px;
  height: 3px;
  background: #dfc5b3;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 35px;
}

.splash-loader::after {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  background: #a66c4f;
  transform: translateX(-100%);
  animation: loading 1.3s ease .3s forwards;
}

@keyframes logoIn {
  from { opacity: 0; transform: translateY(18px) scale(.8); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes textIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes loading {
  to { transform: translateX(0); }
}

@keyframes splashOut {
  to {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div id="splash">
  <div class="splash-logo">BS</div>
  <div class="splash-title">Bill Snap</div>
  <div class="splash-subtitle">YOUR BILLS, SIMPLIFIED</div>
  <div class="splash-loader"></div>
</div>

<main id="app"></main>

<div id="toast"></div>

<nav>
  <button id="n-snap">Snap</button>
  <button id="n-list">Bills</button>
</nav>

<script>
  setTimeout(() => {
    document.getElementById("splash")?.remove();
  }, 2000);
</script>

<script type="module" src="/app.js"></script>

</body>
</html>
