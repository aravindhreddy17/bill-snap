<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b5f"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-180.png">
<title>Bill Snap</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#76746d;--ac:#0f7b5f;--acs:#e3f3ee;--am:#b86e00;--amb:#fff4dc;--bd:#e4e1d8;--rd:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--tx:#f1efe8;--mu:#9a978e;--ac:#3fc29c;--acs:#17332b;--am:#f0b34a;--amb:#3a2d12;--bd:#33322e;--rd:#ef7a6c;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0)}
main{max-width:520px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;border:0;border-radius:14px;padding:14px 16px;background:var(--ac);color:#fff;font-weight:600;width:100%;cursor:pointer;display:block;text-align:center}
.btn.alt{background:var(--acs);color:var(--ac)}button.ghost{background:none;color:var(--mu);padding:10px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx)}
.flag input{border-color:var(--am);background:var(--amb)}
.hint{font-size:12.5px;color:var(--am);margin-top:4px}.ev{font-size:12px;color:var(--mu);margin-top:3px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 13px;border-radius:99px;border:1.5px solid var(--bd);font-size:14px;cursor:pointer;background:var(--card)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:12px;align-items:center}.row img{width:52px;height:52px;object-fit:cover;border-radius:10px;background:var(--bd)}
.grow{flex:1;min-width:0}.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.s{font-size:13px;color:var(--mu)}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:6px;background:var(--acs);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
.spin{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:r 1s linear infinite;margin:0 auto 10px}@keyframes r{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{background:none;color:var(--mu);border-radius:0;padding:14px 4px;font-size:14px}nav button.on{color:var(--ac)}
.warn{background:var(--amb);color:var(--am);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.del{color:var(--rd);font-size:13px;background:none;width:auto;padding:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none}
</style></head><body>
<main id="app"></main><div id="toast"></div>
<nav><button id="n-snap">Snap</button><button id="n-list">Bills</button></nav>
<script type="module" src="/app.js"></script>
</body></html>
